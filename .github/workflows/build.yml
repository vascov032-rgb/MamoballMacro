name: Build Zygisk Module
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    # REMOVIDO O SETUP-ANDROID QUE ESTAVA DANDO ERRO
        
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Compile Java to DEX
      run: |
        mkdir -p build
        # O GitHub já tem o android.jar, a gente só acha ele
        ANDROID_JAR=$(find /usr/local/lib/android/sdk/platforms -name android.jar | head -n 1)
        echo "Usando android.jar em: $ANDROID_JAR"
        javac -classpath $ANDROID_JAR -d build src/com/flork/macro/FlorkOverlay.java
        
        # Acha o compilador D8
        D8_PATH=$(find /usr/local/lib/android/sdk/build-tools -name d8 | head -n 1)
        $D8_PATH --output build build/com/flork/macro/*.class
        mv build/classes.dex zygisk/overlay.dex
        
    - name: Compile C++ (Zygisk)
      run: |
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ \
          -shared -fPIC -o zygisk/arm64-v8a.so zygisk/jni.cpp -I zygisk -llog -ldl -std=c++17
        
    - name: Package ZIP
      run: |
        mkdir -p zip_out/zygisk
        cp module.prop zip_out/
        cp zygisk/arm64-v8a.so zip_out/zygisk/
        cp zygisk/overlay.dex zip_out/zygisk/
        cp zygisk/libflork_android.so zip_out/zygisk/
        cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so zip_out/zygisk/
        cd zip_out && zip -r ../mamoball_macro.zip *
        
    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Mamoball-Macro-ZIP
        path: mamoball_macro.zip
